<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <div>
    <label for="studentRollNo">Roll Number</label>

    <input
      id="studentRollNo"
      type="text"
      formControlName="rollNo"
      placeholder="Enter your Roll Number"
    />

    @if (loginForm.controls.rollNo.touched && loginForm.controls.rollNo.invalid) {
      <small class="error"> Please enter a valid roll number. </small>
    }
  </div>

  <div>
    <label for="studentPassword">Password</label>

    <input
      id="studentPassword"
      type="password"
      formControlName="password"
      placeholder="Enter your Password"
    />

    @if (loginForm.controls.password.touched && loginForm.controls.password.invalid) {
      <small class="error"> Password is required. </small>
    }
  </div>

  <button type="submit" [disabled]="loginForm.invalid || isSubmitting()">
    @if (isSubmitting()) {
      Logging in...
    } @else {
      Login
    }
  </button>
</form>
